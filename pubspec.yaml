name: kino_oracle
description: Oracle of Bacon style movie-connection game.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.3.0
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  open_filex: ^4.7.0
  path_provider: ^2.1.0
  package_info_plus: ^10.2.2
  shared_preferences: ^2.2.0
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#14100C"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
