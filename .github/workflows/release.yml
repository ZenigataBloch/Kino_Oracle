name: Release APK

# Si avvia quando spingi un tag tipo v1.0.2
on:
  push:
    tags: ['v*']

permissions:
  contents: write # serve per creare la release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Chiave di firma salvata nei Secrets del repository (mai nel codice).
      - name: Prepara la chiave di firma
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.jks
          EOF

      - run: flutter pub get

      # Genera le icone (ciak dorato) da assets/icon/ direttamente nella build.
      - run: dart run flutter_launcher_icons

      # La versione viene dal tag (v1.0.2 -> 1.0.2); il numero di build sale a ogni esecuzione.
      - name: Compila l'APK
        run: |
          flutter build apk --release \
            --build-name="${GITHUB_REF_NAME#v}" \
            --build-number="${{ github.run_number }}"

      - name: Pubblica la release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
